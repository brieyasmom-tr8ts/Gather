<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gala Scavenger Hunt</title>
<style>
  :root { --green:#1f8a4c; --dark:#12372a; --bg:#f4f7f5; --card:#fff; --line:#dbe5df; --muted:#5d6b64; --warn:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif; background:var(--bg); color:#17211c; }
  header { background:var(--dark); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  header h1 { font-size:17px; margin:0; }
  header .score { font-weight:700; background:var(--green); padding:4px 10px; border-radius:99px; font-size:14px; }
  main { max-width:640px; margin:0 auto; padding:12px 12px 80px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:10px 0; }
  .card.done { border:2px solid var(--green); background:#eef8f1; }
  .card.done .text { color:#3d5a49; }
  .donepill { display:inline-block; background:var(--green); color:#fff; font-weight:700; font-size:13px; padding:3px 10px; border-radius:99px; margin-left:4px; }
  .progress { height:12px; background:#e3ebe6; border-radius:99px; overflow:hidden; margin:8px 0 12px; }
  .progress > div { height:100%; background:var(--green); border-radius:99px; transition:width .3s; }
  .checks { display:grid; grid-template-columns:repeat(8, 1fr); gap:6px; }
  .checks a { display:flex; align-items:center; justify-content:center; height:38px; border-radius:8px; font-weight:700; font-size:14px; text-decoration:none;
              border:2px solid var(--line); color:var(--muted); background:#fff; }
  .checks a.on { background:var(--green); border-color:var(--green); color:#fff; }
  .checks a.busy { border-color:#e0a800; color:#8a6500; background:#fff8e1; }
  .legend { font-size:12px; color:var(--muted); margin-top:8px; }
  .filters { display:flex; gap:6px; margin:12px 0 0; }
  .filters button { margin:0; padding:8px 6px; font-size:14px; background:#e8efeb; color:var(--dark); }
  .filters button.on { background:var(--dark); color:#fff; }
  .alldone { text-align:center; padding:24px 14px; color:var(--muted); }
  .round { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--green); font-weight:700; margin:20px 4px 4px; }
  .num { display:inline-block; background:var(--dark); color:#fff; border-radius:6px; padding:1px 8px; font-size:13px; font-weight:700; margin-right:6px; }
  .pts { float:right; color:var(--muted); font-size:13px; }
  .text { margin:8px 0 10px; line-height:1.4; }
  input[type=text], input[type=password], textarea { width:100%; padding:11px; font-size:16px; border:1px solid var(--line); border-radius:8px; margin:4px 0; font-family:inherit; }
  textarea { min-height:70px; }
  button { background:var(--green); color:#fff; border:0; border-radius:8px; padding:11px 16px; font-size:16px; font-weight:600; width:100%; margin-top:6px; }
  button.secondary { background:#e8efeb; color:var(--dark); }
  button:disabled { opacity:.55; }
  label.file { display:block; text-align:center; padding:11px; border:2px dashed var(--green); color:var(--green); border-radius:8px; font-weight:600; margin:4px 0; }
  label.file input { display:none; }
  .status { font-size:13px; margin-top:6px; color:var(--muted); }
  .err { color:var(--warn); font-size:14px; margin:6px 0; }
  .badge { font-size:12px; padding:2px 8px; border-radius:99px; background:#e8efeb; color:var(--dark); }
  .badge.scored { background:var(--green); color:#fff; }
  img.thumb, video.thumb { width:100%; max-height:220px; object-fit:cover; border-radius:8px; margin-top:8px; background:#000; }
  .tabs { display:flex; gap:6px; margin:8px 0; }
  .tabs button { margin:0; background:#e8efeb; color:var(--dark); }
  .tabs button.on { background:var(--green); color:#fff; }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:10px 6px; text-align:left; border-bottom:1px solid var(--line); }
  td.r, th.r { text-align:right; }
  .locked { background:#fff3cd; border:1px solid #e6cf7a; padding:10px; border-radius:8px; margin:10px 0; }
</style>
</head>
<body>
<header>
  <h1 id="title">Gala Scavenger Hunt</h1>
  <span class="score" id="score" hidden></span>
</header>
<main id="app"></main>

<script src="items.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const app = $('#app');
const ITEMS = window.HUNT_ITEMS;
// Private team link: /hunt/?c=CODE. The code is saved on this phone and removed from the address bar.
(function () {
  try {
    const c = new URLSearchParams(location.search).get('c');
    if (c) { localStorage.setItem('hunt_code', c); history.replaceState(null, '', location.pathname); }
  } catch (e) {}
})();
let code = ''; try { code = localStorage.getItem('hunt_code') || ''; } catch (e) {}
let token = localStorage.getItem('hunt_token') || '';
const mediaUrl = (k) => '/api/hunt/media/' + encodeURIComponent(String(k).replace(/^hunt\//, '')) + '?c=' + encodeURIComponent(code);
let me = null, subs = {}, locked = false, tab = 'hunt';

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function api(path, opts = {}) {
  opts.headers = Object.assign({}, opts.headers, { 'x-hunt-code': code }, token ? { authorization: 'Bearer ' + token } : {});
  const r = await fetch('/api/hunt/' + path, opts);
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

function renderJoin(err) {
  $('#score').hidden = true;
  app.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0">Join your team</h2>
      <p>One phone per team does the uploading. Pick a team name and a 4 digit PIN. Teammates can use the same name and PIN on their own phones to see the same hunt.</p>
      <input type="text" id="tname" placeholder="Team name" maxlength="40" autocomplete="off">
      <input type="password" id="tpin" placeholder="PIN" inputmode="numeric" maxlength="12">
      ${err ? `<div class="err">${esc(err)}</div>` : ''}
      <button id="go">Start hunting</button>
    </div>`;
  $('#go').onclick = async () => {
    try {
      const d = await api('join', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: $('#tname').value, pin: $('#tpin').value }) });
      token = d.token; localStorage.setItem('hunt_token', token);
      await load();
    } catch (e) { renderJoin(e.message); }
  };
}

async function load() {
  try {
    const d = await api('me');
    me = d.team; locked = d.locked;
    subs = {}; d.submissions.forEach(s => subs[s.item_id] = s);
    render();
  } catch (e) {
    token = ''; localStorage.removeItem('hunt_token'); renderJoin();
  }
}

function myScore() { return Object.values(subs).reduce((a, s) => a + (s.points || 0), 0); }

function render() {
  $('#title').textContent = me.name;
  const sc = $('#score'); sc.hidden = false; sc.textContent = myScore() + ' pts judged';
  app.innerHTML = `
    <div class="tabs">
      <button id="t1" class="${tab==='hunt'?'on':''}">The hunt</button>
      <button id="t2" class="${tab==='board'?'on':''}">Leaderboard</button>
    </div>
    <div id="body"></div>`;
  $('#t1').onclick = () => { tab = 'hunt'; render(); };
  $('#t2').onclick = () => { tab = 'board'; render(); };
  tab === 'hunt' ? renderHunt() : renderBoard();
}

// Unsaved typed answers survive re-renders and page reloads.
let drafts = {};
const draftKey = () => 'hunt_drafts_' + (me ? me.id : '');
function loadDrafts() { try { drafts = JSON.parse(localStorage.getItem(draftKey()) || '{}'); } catch (e) { drafts = {}; } }
function saveDrafts() { try { localStorage.setItem(draftKey(), JSON.stringify(drafts)); } catch (e) {} }
// Files picked but not yet confirmed saved (upload in progress or failed). Never thrown away.
const pending = {};
let uploadsInFlight = 0;
window.addEventListener('beforeunload', (e) => {
  if (uploadsInFlight > 0) { e.preventDefault(); e.returnValue = ''; }
});

// Shrink big phone photos before upload so they go faster on mall wifi/cell.
async function shrinkImage(file) {
  try {
    if (!file.type.startsWith('image/') || file.size < 1500000 || file.type === 'image/gif') return file;
    const bmp = await createImageBitmap(file);
    const max = 2000, scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.85));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], (file.name || 'photo').replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e) { return file; }
}

function cardHtml(it) {
  const s = subs[it.id];
  const p = pending[it.id];
  const accept = it.kind === 'video' ? 'video/*' : 'image/*,video/*';
  const needsText = it.kind === 'answer';
  const answerVal = drafts[it.id] != null ? drafts[it.id] : (s ? s.answer || '' : '');
  let state = '';
  if (p && p.uploading) state = `<div class="status">Uploading ${p.file.type.startsWith('video/') ? 'video' : 'photo'}… keep this page open.</div>`;
  else if (p && p.error) state = `<div class="err">Not saved yet: ${esc(p.error)}</div><button class="retry">Try upload again</button>`;
  else if (s && s.media_key) state = `<div class="status" style="color:var(--green)">✓ Saved</div>`;
  return `<div class="card ${s ? 'done' : ''}" data-id="${it.id}" id="c${it.id}" style="scroll-margin-top:70px">
      <span class="pts">${it.pts} pts</span>
      <span class="num">${it.id}</span>
      ${s ? `<span class="donepill">✓ Done</span>${s.points != null ? ` <span class="badge scored">${s.points} pts awarded</span>` : ''}` : ''}
      <div class="text">${esc(it.text)}</div>
      ${s && s.media_key ? (s.media_type === 'video'
        ? `<video class="thumb" src="${esc(mediaUrl(s.media_key))}" controls playsinline preload="metadata"></video>`
        : `<img class="thumb" src="${esc(mediaUrl(s.media_key))}" alt="">`) : ''}
      ${state}
      ${s && s.answer && locked ? `<div class="status"><b>Answer:</b> ${esc(s.answer)}</div>` : ''}
      ${locked ? '' : `
      <label class="file">${s && s.media_key ? 'Replace' : (it.kind === 'video' ? 'Record or choose video' : 'Take or choose photo')}
        <input type="file" accept="${accept}" ${it.kind==='video' ? 'capture' : ''} class="f">
      </label>
      <div class="status" style="margin-top:0">Photos and videos save automatically as soon as you pick them.</div>
      <textarea class="a" placeholder="${needsText ? 'Your answer (required)' : 'Caption or answer (optional)'}">${esc(answerVal)}</textarea>
      <button class="send">${s && s.answer ? 'Update answer' : 'Save answer'}</button>
      <div class="status msg"></div>`}
    </div>`;
}

let view = 'all'; try { view = localStorage.getItem('hunt_view') || 'all'; } catch (e) {}

function updateSummary() {
  const done = ITEMS.filter(it => subs[it.id]).length;
  const el = $('#summary');
  if (el) el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <b style="font-size:18px">${done} of ${ITEMS.length} done</b>
      <span class="status" style="margin:0">${ITEMS.length - done} to go</span>
    </div>
    <div class="progress"><div style="width:${Math.round(done / ITEMS.length * 100)}%"></div></div>
    <div class="checks">${ITEMS.map(it => `<a href="#c${it.id}" data-jump="${it.id}" class="${subs[it.id] ? 'on' : (pending[it.id] ? 'busy' : '')}" aria-label="Challenge ${it.id}${subs[it.id] ? ' done' : ''}">${subs[it.id] ? '✓' : it.id}</a>`).join('')}</div>
    <div class="legend">Green ✓ = done. Tap a number to jump to it. Judges add points after review.</div>
    <div class="filters">
      <button data-v="todo" class="${view==='todo'?'on':''}">To do (${ITEMS.length - done})</button>
      <button data-v="done" class="${view==='done'?'on':''}">Done (${done})</button>
      <button data-v="all" class="${view==='all'?'on':''}">All</button>
    </div>`;
  if (el) {
    el.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
      view = b.dataset.v; try { localStorage.setItem('hunt_view', view); } catch (e) {}
      renderHunt();
    });
    el.querySelectorAll('[data-jump]').forEach(a => a.onclick = (e) => {
      e.preventDefault();
      const id = a.dataset.jump;
      let card = document.querySelector(`.card[data-id="${id}"]`);
      if (!card || card.style.display === 'none') { view = 'all'; renderHunt(); card = document.querySelector(`.card[data-id="${id}"]`); }
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }
  $('#score').textContent = myScore() + ' pts judged';
}

function refreshCard(id) {
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (!card) return;
  const it = ITEMS.find(x => String(x.id) === String(id));
  card.outerHTML = cardHtml(it);
  bindCard(document.querySelector(`.card[data-id="${id}"]`));
  updateSummary();
}

async function upload(id, { file, answer }) {
  const fd = new FormData();
  fd.append('item_id', id);
  fd.append('answer', answer || '');
  if (file) fd.append('file', file);
  const d = await api('submit', { method: 'POST', body: fd });
  if (d.submission) subs[id] = d.submission;
  return d;
}

async function uploadFile(id, original) {
  pending[id] = { file: original, uploading: true };
  refreshCard(id);
  uploadsInFlight++;
  try {
    const file = await shrinkImage(original);
    const ans = drafts[id] != null ? drafts[id] : '';
    await upload(id, { file, answer: ans });
    delete pending[id];
    if (ans) { delete drafts[id]; saveDrafts(); }
  } catch (e) {
    pending[id] = { file: original, error: e.message || 'Upload failed' };
  } finally {
    uploadsInFlight--;
    refreshCard(id);
  }
}

function bindCard(card) {
  if (!card) return;
  const id = card.dataset.id;
  const fileInput = card.querySelector('.f');
  const ta = card.querySelector('.a');
  const send = card.querySelector('.send');
  const retry = card.querySelector('.retry');
  if (ta) ta.oninput = () => { drafts[id] = ta.value; saveDrafts(); };
  if (fileInput) fileInput.onchange = () => { const f = fileInput.files[0]; if (f) uploadFile(id, f); };
  if (retry) retry.onclick = () => uploadFile(id, pending[id].file);
  if (send) send.onclick = async () => {
    const msg = card.querySelector('.msg');
    const ans = ta.value.trim();
    if (!ans) { msg.textContent = 'Type an answer first. Photos save on their own.'; msg.className = 'status msg err'; return; }
    send.disabled = true; msg.className = 'status msg'; msg.textContent = 'Saving…';
    try {
      await upload(id, { answer: ans });
      delete drafts[id]; saveDrafts();
      refreshCard(id);
      const m2 = document.querySelector(`.card[data-id="${id}"] .msg`);
      if (m2) { m2.textContent = '✓ Answer saved'; m2.style.color = 'var(--green)'; }
    } catch (e) { msg.textContent = e.message; msg.className = 'status msg err'; send.disabled = false; }
  };
}

function renderHunt() {
  loadDrafts();
  let html = `<div class="card" id="summary"></div>`;
  if (locked) html += `<div class="locked">The hunt is closed. Submissions are locked.</div>`;
  let lastRound = '';
  const shown = ITEMS.filter(it => view === 'all' || (view === 'done' ? !!subs[it.id] : (!subs[it.id] || pending[it.id])));
  shown.forEach(it => {
    if (it.round !== lastRound) { html += `<div class="round">${esc(it.round)}</div>`; lastRound = it.round; }
    html += cardHtml(it);
  });
  if (!shown.length) html += `<div class="card alldone">${view === 'todo' ? '🎉 Everything is done! Nice work.' : 'Nothing done yet. Pick a challenge and add a photo.'}</div>`;
  $('#body').innerHTML = html;
  updateSummary();
  document.querySelectorAll('.card[data-id]').forEach(bindCard);
}

async function renderBoard() {
  $('#body').innerHTML = '<div class="card">Loading...</div>';
  try {
    const rows = await api('leaderboard');
    $('#body').innerHTML = `<div class="card"><table>
      <tr><th>#</th><th>Team</th><th class="r">Done</th><th class="r">Points</th></tr>
      ${rows.map((r, i) => `<tr><td>${i+1}</td><td>${esc(r.name)}</td><td class="r">${r.done}</td><td class="r"><b>${r.score}</b></td></tr>`).join('')}
    </table></div>`;
  } catch (e) { $('#body').innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}

function renderCode(err) {
  $('#score').hidden = true;
  app.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0">Enter the hunt code</h2>
      <p>Use the private hunt link you were given, or type the hunt code here.</p>
      <input type="text" id="hcode" placeholder="Hunt code" autocapitalize="none" autocomplete="off">
      ${err ? `<div class="err">${esc(err)}</div>` : ''}
      <button id="gocode">Continue</button>
    </div>`;
  $('#gocode').onclick = async () => {
    code = $('#hcode').value.trim();
    try {
      await api('leaderboard');
      try { localStorage.setItem('hunt_code', code); } catch (e) {}
      token ? load() : renderJoin();
    } catch (e) { code = ''; renderCode('That code didn\'t work. Check it and try again.'); }
  };
}
if (!code) { renderCode(); } else { token ? load() : renderJoin(); }
</script>
</body>
</html>
