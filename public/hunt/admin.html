<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hunt Judging</title>
<style>
  :root { --green:#1f8a4c; --dark:#12372a; --bg:#f4f7f5; --line:#dbe5df; --muted:#5d6b64; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif; background:var(--bg); color:#17211c; }
  header { background:var(--dark); color:#fff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5; }
  main { max-width:900px; margin:0 auto; padding:12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin:10px 0; }
  input, select { padding:9px; font-size:15px; border:1px solid var(--line); border-radius:8px; }
  button { background:var(--green); color:#fff; border:0; border-radius:8px; padding:9px 14px; font-size:15px; font-weight:600; }
  button.alt { background:#e8efeb; color:var(--dark); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; }
  img, video { width:100%; max-height:240px; object-fit:cover; border-radius:8px; background:#000; }
  .meta { font-size:13px; color:var(--muted); margin:6px 0; }
  .row { display:flex; gap:6px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .row input[type=number] { width:80px; }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; }
  td.r, th.r { text-align:right; }
</style>
</head>
<body>
<header><b>Hunt Judging</b><span id="lockstate"></span></header>
<main id="app"></main>
<script src="items.js"></script>
<script>
const ITEMS = Object.fromEntries(window.HUNT_ITEMS.map(i => [i.id, i]));
let key = sessionStorage.getItem('admin_key') || '';
const app = document.getElementById('app');
let filterTeam = '', filterPending = false;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'x-admin-key': key }, opts.headers || {});
  const r = await fetch('/api/hunt/admin/' + path, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Error');
  return d;
}
const post = (p, body) => api(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });

function login(err) {
  app.innerHTML = `<div class="card"><h3>Judge login</h3>
    <input type="password" id="k" placeholder="Admin key"> <button id="go">Enter</button>
    ${err ? `<p style="color:#b3261e">${esc(err)}</p>` : ''}</div>`;
  document.getElementById('go').onclick = () => {
    key = document.getElementById('k').value; sessionStorage.setItem('admin_key', key); load();
  };
}

async function load() {
  try {
    const d = await api('submissions');
    draw(d);
  } catch (e) { sessionStorage.removeItem('admin_key'); login(e.message); }
}

function draw(d) {
  document.getElementById('lockstate').textContent = d.locked ? 'LOCKED' : 'OPEN';
  const teams = d.teams;
  let subs = d.submissions;
  if (filterTeam) subs = subs.filter(s => String(s.team_id) === filterTeam);
  if (filterPending) subs = subs.filter(s => s.points == null);

  app.innerHTML = `
    <div class="card">
      <div class="row">
        <button id="lock">${d.locked ? 'Reopen submissions' : 'Lock submissions'}</button>
        <button class="alt" id="refresh">Refresh</button>
        <select id="ft"><option value="">All teams</option>${teams.map(t => `<option value="${t.id}" ${String(t.id)===filterTeam?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
        <label><input type="checkbox" id="fp" ${filterPending?'checked':''}> Unscored only</label>
      </div>
    </div>
    <div class="card"><b>Standings</b>
      <table><tr><th>Team</th><th class="r">Done</th><th class="r">Score</th><th></th></tr>
      ${teams.map(t => `<tr><td>${esc(t.name)}</td><td class="r">${t.done}</td><td class="r"><b>${t.score}</b></td>
        <td class="r"><button class="alt bonus" data-t="${t.id}">+ Bonus</button></td></tr>`).join('')}</table>
    </div>
    <div class="grid">
    ${subs.map(s => { const it = ITEMS[s.item_id] || { text: '', pts: 0 }; return `
      <div class="card">
        <b>${esc(s.team)}</b> &middot; #${s.item_id} <span class="meta">(${it.pts} pts)</span>
        <div class="meta">${esc(it.text)}</div>
        ${s.media_key ? (s.media_type === 'video'
          ? `<video src="/api/hunt/media/${esc(String(s.media_key).replace(/^hunt\//, ''))}?k=${encodeURIComponent(key)}" controls playsinline preload="metadata"></video>`
          : `<img src="/api/hunt/media/${esc(String(s.media_key).replace(/^hunt\//, ''))}?k=${encodeURIComponent(key)}" alt="">`) : ''}
        ${s.answer ? `<div class="meta"><b>Answer:</b> ${esc(s.answer)}</div>` : ''}
        <div class="row">
          <input type="number" value="${s.points == null ? '' : s.points}" placeholder="pts" class="pts" data-id="${s.id}">
          <button class="save" data-id="${s.id}">Save</button>
          <button class="alt full" data-id="${s.id}" data-p="${it.pts}">Full ${it.pts}</button>
          <button class="alt zero" data-id="${s.id}">0</button>
        </div>
      </div>`; }).join('')}
    </div>`;

  document.getElementById('lock').onclick = async () => { await post('lock', { locked: !d.locked }); load(); };
  document.getElementById('refresh').onclick = load;
  document.getElementById('ft').onchange = (e) => { filterTeam = e.target.value; load(); };
  document.getElementById('fp').onchange = (e) => { filterPending = e.target.checked; load(); };
  document.querySelectorAll('.save').forEach(b => b.onclick = async () => {
    const v = document.querySelector(`.pts[data-id="${b.dataset.id}"]`).value;
    await post('score', { id: +b.dataset.id, points: v === '' ? null : +v }); load();
  });
  document.querySelectorAll('.full').forEach(b => b.onclick = async () => { await post('score', { id: +b.dataset.id, points: +b.dataset.p }); load(); });
  document.querySelectorAll('.zero').forEach(b => b.onclick = async () => { await post('score', { id: +b.dataset.id, points: 0 }); load(); });
  document.querySelectorAll('.bonus').forEach(b => b.onclick = async () => {
    const pts = prompt('Bonus points (negative for late penalty):'); if (pts === null) return;
    const note = prompt('Note (optional):') || '';
    await post('bonus', { team_id: +b.dataset.t, points: +pts, note }); load();
  });
}

key ? load() : login();
</script>
</body>
</html>
