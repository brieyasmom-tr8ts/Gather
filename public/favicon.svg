<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#085078"/>
      <stop offset="100%" stop-color="#042B3E"/>
    </linearGradient>
    <filter id="pinShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Ground oval shadow -->
  <ellipse cx="256" cy="410" rx="100" ry="22" fill="#85D8CE" opacity="0.3"/>
  <ellipse cx="256" cy="410" rx="70" ry="14" fill="#85D8CE" opacity="0.2"/>

  <!-- Pin shape -->
  <g filter="url(#pinShadow)">
    <!-- Pin body -->
    <path d="M256 395 L222 330 C180 268 160 240 160 200 C160 147 203 104 256 104 C309 104 352 147 352 200 C352 240 332 268 290 330 Z"
          fill="#e8f4f2" stroke="none"/>
    <!-- Pin inner circle -->
    <circle cx="256" cy="200" r="62" fill="none" stroke="#85D8CE" stroke-width="6" opacity="0.5"/>
  </g>

  <!-- Snowflake/asterisk symbol inside pin -->
  <g stroke="#085078" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <!-- Vertical line -->
    <line x1="256" y1="170" x2="256" y2="230"/>
    <!-- Horizontal line -->
    <line x1="226" y1="200" x2="286" y2="200"/>
    <!-- Diagonal lines -->
    <line x1="235" y1="179" x2="277" y2="221"/>
    <line x1="277" y1="179" x2="235" y2="221"/>
  </g>

  <!-- Small dots at snowflake tips -->
  <g fill="#085078" opacity="0.7">
    <circle cx="256" cy="167" r="4"/>
    <circle cx="256" cy="233" r="4"/>
    <circle cx="223" cy="200" r="4"/>
    <circle cx="289" cy="200" r="4"/>
    <circle cx="232" cy="176" r="4"/>
    <circle cx="280" cy="224" r="4"/>
    <circle cx="280" cy="176" r="4"/>
    <circle cx="232" cy="224" r="4"/>
  </g>
</svg>
